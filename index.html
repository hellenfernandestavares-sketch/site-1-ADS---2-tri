<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu blog</title>
    <style>
        header {
            background-color: hotpink;
            color: rgb(61, 64, 69);
            text-align: center;
            max-width: 800px; /* Adicionado o : */
            margin: 0 auto;
            padding: 16px;    /* Adicionado o : */
        }
        main {
            background-color: rgb(251, 4, 4);
            color: rgb(0, 0, 0);
            text-align: center;
            max-width: 800px; /* Adicionado o : */
            margin: 0 auto;
            padding: 16px;    /* Adicionado o : */
        }
    </style>
</head>
<body>

    <!-- Agrupado o topo dentro da tag <header> -->
    <header>
        <h1>Fã clube do homem aranha, e mulher aranha</h1>
        <p>Venha fazer parte do fã clube!</p>
    </header>

    <!-- Agrupado o conteúdo principal dentro da tag <main> -->
    <main>
        <h2>Aqui é o lugar de apaixonados pelo Peter Parker e pela Gwen Stacy</h2>
        <p>Sejam bem vindos ao fã clube</p>
        <p>Por Hellen Tavares</p>
        <button><span>0</span></button>
    </main>

</body>
<script>
const botao = document.querySelector("button");
botao.addEventListener("click", botaoClicado);
function botaoClicado() {
console.log("fui clicado");
let texto = botao.querySelector("span");
texto.textContent++;
}

</script>
</html>
